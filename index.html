<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101418" />
  <meta name="description" content="Your weekly gym plan: Shoulders, Back, Legs, Chest and Arms — different every week." />
  <title>Stay Strong — Gym Planner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stay Strong" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="brand"><span class="brand-icon">🏋️</span> Stay Strong</h1>
      <button id="unitToggle" class="unit-toggle" type="button" aria-label="Switch weight unit">kg</button>
    </div>
    <div class="week-nav">
      <button id="prevWeek" class="week-arrow" type="button" aria-label="Previous week">‹</button>
      <div class="week-label">
        <div id="weekTitle" class="week-title">Week 31</div>
        <div id="weekDates" class="week-dates"></div>
      </div>
      <button id="nextWeek" class="week-arrow" type="button" aria-label="Next week">›</button>
    </div>
  </header>

  <section id="phaseBanner" class="phase-banner" aria-live="polite"></section>

  <nav id="dayTabs" class="day-tabs" aria-label="Training days"></nav>

  <main id="content" class="content"></main>

  <div id="restTimer" class="rest-timer" hidden>
    <div class="rest-progress"><div id="restFill" class="rest-fill"></div></div>
    <div class="rest-row">
      <div class="rest-info">
        <span id="restEmoji" class="rest-emoji">⏳</span>
        <div>
          <div id="restTime" class="rest-time">1:00</div>
          <div id="restLabel" class="rest-label">Rest</div>
        </div>
      </div>
      <div class="rest-actions">
        <button id="restPlus" class="rest-btn" type="button">+30 s</button>
        <button id="restSkip" class="rest-btn rest-btn-skip" type="button">Skip</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Plans rotate automatically every week — exercises, sets, reps and weights all change.
    Set your working weight on each exercise and Stay Strong will suggest loads for every phase.</p>
    <p id="appVersion" class="app-version"></p>
  </footer>

  <script src="js/exercises.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register the offline cache, and auto-reload once a new version has
    // installed — so updates apply on the first open, no relaunch dance.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      let hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) { hadController = true; return; } // first-ever install: nothing to swap
        window.location.reload();
      });
    }
  </script>
</body>
</html>
